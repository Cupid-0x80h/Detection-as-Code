title: PowerShell Encoded Command Execution
id: ef1d4172-6511-49af-9767-aa055501c1f4
status: experimental
description: >
    Detects PowerShell started with base64-encoded commands (-enc / -e),
    frequently used by attackers to obfuscate malicious payloads.
references:
    - https://attack.mitre.org/techniques/T1027/
    - https://attack.mitre.org/techniques/T1059/001/
author: Cupid-0x80h
date: 2026-08-26
tags:
    - attack.defense-impairment
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_cmdline:
        CommandLine|contains:
            - '-encodedcommand '
            - ' -enc '
            - ' -ec '
            - 'FromBase64String'
    condition: all of selection_*
falsepositives:
    - Deployment tools such as SCCM that launch encoded PowerShell commands
level: medium
