title: Suspicious Windows Service Installation
id: 2d3cbfad-a3e9-44da-a722-4554705086f5
status: experimental
description: >
    Detects creation of a Windows service through sc.exe or
    New-Service, used for persistence and for running a payload in the
    background as SYSTEM.
references:
    - https://attack.mitre.org/techniques/T1543/003/
author: Cupid-0x80h
date: 2026-10-08
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1543.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_sc:
        Image|endswith:
            - '\sc.exe'
            - '\sc1.exe'
        CommandLine|contains:
            - ' create '
            - 'binPath='
    selection_ps:
        CommandLine|contains:
            - 'New-Service'
            - 'sc.exe create'
    condition: 1 of selection_*
falsepositives:
    - Software installers and configuration management agents
level: medium
