title: LSASS Memory Access via Mimikatz
id: acfc41a0-765a-4cb2-b9a8-e66c5b2f8e49
status: experimental
description: >
    Detects a process opening a handle to lsass.exe with access rights
    commonly requested by credential dumping tools such as Mimikatz.
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: Cupid-0x80h
date: 2026-08-25
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess|contains:
            - '0x1010'
            - '0x1410'
            - '0x143a'
    condition: selection
falsepositives:
    - Antivirus or EDR agents requesting legitimate LSASS access
level: high
