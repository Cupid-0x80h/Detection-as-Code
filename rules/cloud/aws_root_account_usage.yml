title: AWS CloudTrail Root Account Usage
id: 74aa212a-31d1-4d27-953b-b6057ed684d4
status: experimental
description: >
    Detects AWS API calls made by the root account (not IAM users),
    which violates security best practices and may indicate compromise.
references:
    - https://attack.mitre.org/techniques/T1078/004/
author: Cupid-0x80h
date: 2026-08-27
tags:
    - attack.credential-access
    - attack.t1078.004
logsource:
    category: cloudtrail
    product: aws
detection:
    selection:
        userIdentity.type: Root
    condition: selection
falsepositives:
    - Emergency break-glass root usage (should be rare and logged)
level: critical