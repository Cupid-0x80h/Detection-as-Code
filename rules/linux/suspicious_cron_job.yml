title: Suspicious Cron Job Creation
id: 5558b041-bcc3-4dee-9178-55a11e8565ab
status: experimental
description: >
    Detects creation or modification of cron jobs in common locations
    (/etc/cron*, /var/spool/cron) by non-root users or with suspicious
    commands (reverse shells, wget/curl to external hosts).
references:
    - https://attack.mitre.org/techniques/T1053/003/
author: Cupid-0x80h
date: 2026-08-27
tags:
    - attack.persistence
    - attack.t1053.003
logsource:
    category: file_event
    product: linux
detection:
    selection_path:
        TargetFilename|contains:
            - '/etc/cron'
            - '/var/spool/cron'
    selection_cmd:
        Details|contains:
            - 'bash -i'
            - 'sh -i'
            - 'nc -e'
            - 'wget '
            - 'curl '
            - 'base64 -d'
    condition: selection_path and selection_cmd
falsepositives:
    - Legitimate scheduled tasks created by admins
level: high