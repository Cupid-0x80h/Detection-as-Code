title: Suspicious Cron Job Creation
id: 5558b041-bcc3-4dee-9178-55a11e8565ab
status: experimental
description: >
    Detects creation or modification of cron job files under the system
    cron locations (/etc/cron*, /var/spool/cron), a persistence
    mechanism that runs attacker commands on a schedule.
references:
    - https://attack.mitre.org/techniques/T1053/003/
author: Cupid-0x80h
date: 2026-10-08
tags:
    - attack.persistence
    - attack.t1053.003
logsource:
    category: file_event
    product: linux
detection:
    selection:
        TargetFilename|contains:
            - '/etc/cron'
            - '/var/spool/cron'
    condition: selection
falsepositives:
    - Package installs and configuration management updating cron
level: medium
