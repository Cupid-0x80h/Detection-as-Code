title: SSH Brute Force Attempt
id: 7c9ac870-60e1-470f-ac58-cc085face543
status: experimental
description: >
    Detects failed SSH password authentication attempts against
    privileged local accounts, the opening move of a brute force or
    credential stuffing attack.
references:
    - https://attack.mitre.org/techniques/T1110/001/
author: Cupid-0x80h
date: 2026-10-08
tags:
    - attack.credential-access
    - attack.t1110.001
logsource:
    category: authentication
    product: linux
    service: sshd
detection:
    selection_fail:
        message|contains: 'Failed password'
    selection_user:
        message|contains:
            - ' for root'
            - ' for admin'
            - ' for ubuntu'
            - ' for centos'
    condition: all of selection_*
falsepositives:
    - Legitimate users mistyping passwords
level: high
