title: Sudo/Su Privilege Escalation
id: 20c0ec7d-60c7-4660-b2ef-0641df92a31f
status: experimental
description: >
    Detects sudo or su spawning a shell (login or interactive), a step
    taken after privilege escalation or by an attacker with a foothold.
references:
    - https://attack.mitre.org/techniques/T1548/003/
    - https://attack.mitre.org/techniques/T1548/002/
author: Cupid-0x80h
date: 2026-10-08
tags:
    - attack.privilege-escalation
    - attack.t1548.003
logsource:
    category: process_creation
    product: linux
detection:
    selection_sudo:
        Image|endswith: '/sudo'
        CommandLine|contains:
            - ' /bin/bash'
            - ' /bin/sh'
            - ' /bin/zsh'
            - ' -i'
    selection_su:
        Image|endswith: '/su'
        CommandLine|contains:
            - ' -'
            - ' -l'
    condition: 1 of selection_*
falsepositives:
    - Legitimate admin tasks using sudo/su
level: medium
