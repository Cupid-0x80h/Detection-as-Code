title: Sudo/Su Privilege Escalation
id: 20c0ec7d-60c7-4660-b2ef-0641df92a31f
status: experimental
description: >
    Detects successful sudo or su executions by non-root users,
    particularly when spawning shells or running sensitive commands.
references:
    - https://attack.mitre.org/techniques/T1548/003/
    - https://attack.mitre.org/techniques/T1548/002/
author: Cupid-0x80h
date: 2026-08-27
tags:
    - attack.privilege-escalation
    - attack.t1548.003
logsource:
    category: process_creation
    product: linux
detection:
    selection_sudo:
        Image|endswith: '\sudo'
        CommandLine|contains:
            - ' /bin/bash'
            - ' /bin/sh'
            - ' /bin/zsh'
            - ' su -'
    selection_su:
        Image|endswith: '\su'
        CommandLine|contains:
            - ' -'
            - ' -l'
    condition: 1 of selection_*
falsepositives:
    - Legitimate admin tasks using sudo/su
level: medium