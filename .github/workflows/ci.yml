name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate rules (sigma check)
        run: sigma check rules/

      - name: Run tests
        run: pytest tests/ -q

      - name: Compile Sigma -> Kibana NDJSON
        run: |
          mkdir -p out
          sigma convert -t lucene -p ecs_windows -f kibana_ndjson rules/ > out/kibana-rules.ndjson
          cat out/kibana-rules.ndjson

      - uses: actions/upload-artifact@v4
        with:
          name: kibana-rules-${{ github.sha }}
          path: out/kibana-rules.ndjson
