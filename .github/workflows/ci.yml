name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate rules (strict sigma check)
        run: make lint

      - name: Run tests
        run: make test

      - name: Compile Sigma -> Kibana NDJSON
        run: make build

      - uses: actions/upload-artifact@v4
        with:
          name: kibana-rules-${{ github.sha }}
          path: out/kibana-rules.ndjson
